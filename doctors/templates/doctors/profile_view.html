{% extends 'base.html' %}
{% block content %}
<div class="page-wrapper">
    <div class="content">
        <h4 class="page-title">Doctor Profile</h4>

        <ul class="list-group">
            <li class="list-group-item"><strong>Specialization:</strong> {{ profile.specialization }}</li>
            <li class="list-group-item"><strong>Phone:</strong> {{ profile.phone }}</li>
            <li class="list-group-item"><strong>Address:</strong> {{ profile.address }}</li>
            <li class="list-group-item"><strong>Bio:</strong> {{ profile.bio }}</li>
            <li class="list-group-item"><strong>Qualifications:</strong> {{ profile.qualifications }}</li>
        </ul>

        <a href="{% url 'doctor-profile-edit' %}" class="btn btn-outline-primary mt-3">Edit Profile</a>
    </div>
</div>
{% endblock %}
